name: CodeQL

on:
  push:
    branches:
    - main
  schedule:
  - cron: 0 4 * * 1

jobs:
  analyze:
    if: ${{ github.ref == 'refs/heads/main' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.0
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.39.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.0
