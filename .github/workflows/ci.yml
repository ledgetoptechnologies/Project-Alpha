name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [dev]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate canonical Compose configuration
        run: docker compose config >/tmp/compose.yml

      - name: Verify scheduled-worker shared encryption key
        run: bash cron/tests/entrypoint-encryption-key-test.sh

      - name: Build CI images
        run: |
          docker build --target test -t ghcr.io/ledgetoptechnologies/project-alpha:latest .
          docker build --target cron -t ghcr.io/ledgetoptechnologies/project-alpha:cron-latest .
          docker build --target db -t ghcr.io/ledgetoptechnologies/project-alpha:db-latest .

      - name: Build and start real compose path
        run: |
          docker compose up -d
          for i in $(seq 1 20); do
            if curl -sf http://localhost:1627/ >/dev/null 2>&1; then break; fi
            sleep 5
          done

      - name: ASSERT web image identity
        run: |
          docker compose exec -T web sh -c \
            'test -f /usr/local/bin/start.sh && command -v apache2ctl >/dev/null && test -f /var/www/html/index.php' \
            || { echo "WEB IMAGE NOT OK: missing web-stage artifacts"; exit 1; }
          echo "WEB IMAGE OK"

      - name: ASSERT web serves HTTP
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:1627/)
          if [ "$code" != "200" ] && [ "$code" != "302" ]; then
            echo "HTTP code: $code (expected 200 or 302)"; exit 1
          fi
          echo "HTTP code: $code"

      - name: ASSERT CSP clean over plain HTTP
        run: |
          hdrs=$(curl -s -D - -o /dev/null http://localhost:1627/)
          if echo "$hdrs" | grep -iE 'upgrade-insecure-requests|Strict-Transport-Security' >/dev/null; then
            echo "CSP/HSTS found over plain HTTP"; echo "$hdrs"; exit 1
          fi
          echo "CSP/HSTS OK (plain HTTP)"

      - name: ASSERT cron connected to DB over TCP
        run: |
          logs=$(docker compose logs cron)
          if ! echo "$logs" | grep -qE 'DB is ready'; then
            echo "Cron did not report DB ready"; echo "$logs"; exit 1
          fi
          if echo "$logs" | grep -qE 'did not become available'; then
            echo "Cron reported DB did not become available"; echo "$logs"; exit 1
          fi
          echo "CRON DB OK"

      - name: PHP syntax check
        run: |
          docker compose exec -T web sh -c \
            "find /var/www/src -name '*.php' -exec php -l {} \\; 2>&1 | grep -v 'No syntax errors' && exit 1 || exit 0"

      - name: ASSERT Workforce clean routes reach PA
        run: |
          for path in time workforce approvals pay; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:1627/$path")
            if [ "$code" = "404" ] || [ "$code" = "500" ]; then
              echo "/$path returned $code"
              exit 1
            fi
          done
          for path in time/action workforce/action approvals/action pay/action; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:1627/$path")
            if [ "$code" = "404" ] || [ "$code" = "500" ]; then
              echo "/$path returned $code"
              exit 1
            fi
          done
          echo "Workforce routes reach the PA front controller"

      - name: Composer validate
        run: docker compose exec -T web composer validate --strict --no-check-publish

      - name: Composer audit
        run: docker compose exec -T web composer audit --locked

      - name: Frontend regression tests
        run: node --test tests/frontend/*.test.js

      - name: PHPUnit
        run: docker compose exec -T web vendor/bin/phpunit --colors=always

      - name: MySQL concurrent portal scope-lock regressions
        shell: pwsh
        env:
          PORTAL_SCOPE_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: ./tools/run-portal-scope-mysql-integration.ps1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
