name: CI

on:
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  smoke-test:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate canonical Compose configuration
        run: docker compose config >/tmp/compose.yml

      - name: Validate portal-only Compose override
        run: docker compose -f docker-compose.yml -f docker-compose.portal-only.yml config --quiet

      - name: Verify scheduled-worker shared encryption key
        run: bash cron/tests/entrypoint-encryption-key-test.sh

      - name: Verify cron execution profile isolation
        run: bash cron/tests/execution-profile-test.sh

      - name: Build CI images
        run: |
          docker build --target test -t ghcr.io/ledgetoptechnologies/project-alpha:latest .
          docker build --target cron -t ghcr.io/ledgetoptechnologies/project-alpha:cron-latest .
          docker build --target db -t ghcr.io/ledgetoptechnologies/project-alpha:db-latest .

      - name: Assert patched PHP runtime in web and cron images
        run: |
          docker run --rm --entrypoint php ghcr.io/ledgetoptechnologies/project-alpha:latest -r 'if (PHP_VERSION_ID < 80512) { fwrite(STDERR, PHP_VERSION . PHP_EOL); exit(1); }'
          docker run --rm --entrypoint php ghcr.io/ledgetoptechnologies/project-alpha:cron-latest -r 'if (PHP_VERSION_ID < 80512) { fwrite(STDERR, PHP_VERSION . PHP_EOL); exit(1); }'

      - name: Build and start real compose path
        run: |
          docker compose up -d
          for i in $(seq 1 20); do
            if curl -sf http://localhost:1627/ >/dev/null 2>&1; then break; fi
            sleep 5
          done

      - name: ASSERT web image identity
        run: |
          docker compose exec -T web sh -c \
            'test -f /usr/local/bin/start.sh && command -v apache2ctl >/dev/null && test -f /var/www/html/index.php' \
            || { echo "WEB IMAGE NOT OK: missing web-stage artifacts"; exit 1; }
          echo "WEB IMAGE OK"

      - name: ASSERT web serves HTTP
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:1627/)
          if [ "$code" != "200" ] && [ "$code" != "302" ]; then
            echo "HTTP code: $code (expected 200 or 302)"; exit 1
          fi
          echo "HTTP code: $code"

      - name: ASSERT CSP clean over plain HTTP
        run: |
          hdrs=$(curl -s -D - -o /dev/null http://localhost:1627/)
          if echo "$hdrs" | grep -iE 'upgrade-insecure-requests|Strict-Transport-Security' >/dev/null; then
            echo "CSP/HSTS found over plain HTTP"; echo "$hdrs"; exit 1
          fi
          echo "CSP/HSTS OK (plain HTTP)"

      - name: ASSERT cron connected to DB over TCP
        run: |
          logs=$(docker compose logs cron)
          if ! echo "$logs" | grep -qE 'DB is ready'; then
            echo "Cron did not report DB ready"; echo "$logs"; exit 1
          fi
          if echo "$logs" | grep -qE 'did not become available'; then
            echo "Cron reported DB did not become available"; echo "$logs"; exit 1
          fi
          echo "CRON DB OK"

      - name: ASSERT real portal-only cron startup isolation
        run: bash cron/tests/portal-only-compose-test.sh

      - name: PHP syntax check
        run: |
          docker compose exec -T web sh -c \
            "find /var/www/src -name '*.php' -exec php -l {} \\; 2>&1 | grep -v 'No syntax errors' && exit 1 || exit 0"

      - name: ASSERT shelved Workforce routes are unavailable
        run: |
          for path in time workforce approvals pay; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:1627/$path")
            if [ "$code" != "404" ]; then
              echo "/$path returned $code"
              exit 1
            fi
          done
          for path in time/action workforce/action approvals/action pay/action; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:1627/$path")
            if [ "$code" != "404" ]; then
              echo "/$path returned $code"
              exit 1
            fi
          done
          echo "Workforce routes are shelved by the PA front controller"

      - name: Composer validate
        run: docker compose exec -T web composer validate --strict --no-check-publish

      - name: Composer audit
        run: docker compose exec -T web composer audit --locked

      - name: Frontend regression tests
        run: node --test tests/frontend/*.test.js

      - name: PHPUnit
        run: docker compose exec -T web vendor/bin/phpunit --colors=always

      - name: MySQL recurring activation and historical payment regressions
        shell: bash
        run: |
          root_password="$(docker compose exec -T db printenv MYSQL_ROOT_PASSWORD)"
          test -n "$root_password"
          MYSQL_PASSWORD="$root_password" docker compose run --rm --no-deps --entrypoint php \
            --env MYSQL_USER=root --env MYSQL_PASSWORD \
            web vendor/bin/phpunit --do-not-cache-result --fail-on-skipped \
            --filter 'ContractBillingActivationDatabaseTest|RecurringHistoryDatabaseTest' tests/Database

      - name: MySQL Stripe invoice payment lifecycle regressions
        shell: bash
        run: |
          root_password="$(docker compose exec -T db printenv MYSQL_ROOT_PASSWORD)"
          test -n "$root_password"
          PA_STRIPE_HANDLER_TEST_PASSWORD="$root_password" docker compose run --rm --no-deps --entrypoint php \
            --env PA_STRIPE_HANDLER_TEST_USER=root --env PA_STRIPE_HANDLER_TEST_PASSWORD \
            --env PA_DISPOSABLE_SCHEMA_PROOF=1 \
            --env PA_STRIPE_HANDLER_TEST_ALLOW=isolated-disposable-only \
            --env 'PA_STRIPE_HANDLER_TEST_DSN=mysql:host=db;port=3306;dbname=project_alpha;charset=utf8mb4' \
            web vendor/bin/phpunit --do-not-cache-result --fail-on-skipped \
            tests/Payments/StripeInvoiceHandlersTest.php \
            tests/Payments/StripeSinglePaymentReconciliationTest.php

      - name: Stripe reconciliation front-controller HTTP security regressions
        env:
          STRIPE_RECONCILIATION_HTTP_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: node scripts/run-stripe-reconciliation-http-mysql.mjs

      - name: MySQL invoice issuer transaction and schema regressions
        shell: bash
        run: |
          root_password="$(docker compose exec -T db printenv MYSQL_ROOT_PASSWORD)"
          test -n "$root_password"
          MYSQL_PASSWORD="$root_password" docker compose run --rm --no-deps --entrypoint php \
            --env MYSQL_USER=root --env MYSQL_PASSWORD \
            --env PA_DISPOSABLE_SCHEMA_PROOF=1 \
            web vendor/bin/phpunit --do-not-cache-result --fail-on-skipped \
            tests/Database/InvoiceEditorIssuerTransactionDatabaseTest.php

      - name: MySQL portal snapshot recovery and legacy replan regressions
        shell: bash
        run: |
          root_password="$(docker compose exec -T db printenv MYSQL_ROOT_PASSWORD)"
          test -n "$root_password"
          MYSQL_PASSWORD="$root_password" docker compose run --rm --no-deps --entrypoint php \
            --env MYSQL_USER=root --env MYSQL_PASSWORD \
            --env PA_DISPOSABLE_SCHEMA_PROOF=1 \
            --env PA_PORTAL_RECOVERY_MYSQL_ALLOW=isolated-disposable-only \
            web vendor/bin/phpunit --do-not-cache-result --fail-on-skipped \
            tests/Database/PortalProjectionRecoveryDatabaseTest.php

      - name: MySQL concurrent portal scope-lock regressions
        shell: pwsh
        env:
          PORTAL_SCOPE_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: ./tools/run-portal-scope-mysql-integration.ps1

      - name: MySQL financial HTTP and migration release rehearsal
        env:
          API_V2_FINANCIAL_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: node scripts/run-api-v2-financial-http-mysql.mjs

      - name: MySQL company financial summary HTTP and snapshot regressions
        env:
          API_V2_FINANCIAL_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: node scripts/run-api-v2-company-financial-summary-mysql.mjs

      - name: MySQL concurrent API-key rate-limit regressions
        shell: pwsh
        env:
          API_RATE_LIMIT_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: ./tools/run-api-rate-limit-mysql-integration.ps1

      - name: MySQL API v2 Project synchronization regressions
        shell: pwsh
        env:
          API_V2_PROJECT_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: ./tools/run-api-v2-project-lifecycle-mysql-integration.ps1

      - name: MySQL API v2 catalog and adoption read regressions
        shell: pwsh
        env:
          API_V2_READ_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: ./tools/run-api-v2-read-mysql-integration.ps1

      - name: MySQL API v2 directory client profile regressions
        shell: pwsh
        env:
          API_V2_CLIENT_PROFILE_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: ./tools/run-api-v2-client-profile-mysql-integration.ps1

      - name: MySQL API v2 directory creation regressions
        shell: pwsh
        env:
          API_V2_DIRECTORY_CREATE_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: ./tools/run-api-v2-directory-create-mysql-integration.ps1

      - name: MySQL API v2 directory organization and lifecycle regressions
        shell: pwsh
        env:
          API_V2_ORG_PROFILE_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: ./tools/run-api-v2-organization-profile-mysql-integration.ps1

      - name: MySQL API v2 directory cutover gate regressions
        shell: pwsh
        env:
          DIRECTORY_CUTOVER_GATE_MYSQL_TEST_IMAGE: ghcr.io/ledgetoptechnologies/project-alpha:latest
        run: ./tools/run-directory-cutover-gate-mysql-integration.ps1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
