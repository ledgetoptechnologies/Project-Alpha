name: Deploy to Staging

# Hosted staging retired: branch iteration now runs locally.
# Keep every job disabled so merging this historical file cannot reactivate SSH deployment.
on:
  workflow_dispatch: null

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging server via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: false
          script: |
            set -e
            cd /home/bkoltz/Project-Alpha
            echo "=== Fetch and checkout staging ==="
            git fetch origin
            git checkout staging
            git reset --hard origin/staging
            echo "=== Rebuild and restart staging ==="
            docker compose -f docker-compose.staging.yml down
            docker compose -f docker-compose.staging.yml up -d --build
            sleep 10
            echo "=== Run migrations ==="
            docker compose -f docker-compose.staging.yml exec -T web-staging php /var/www/src/migrations/run_migrations.php --verbose || true
            echo "=== Health check ==="
            for i in 1 2 3; do
              curl -sf http://127.0.0.1:1628 && break
              sleep 5
            done
            echo "=== Staging deployed at $(hostname -I | awk '{print $1}'):1628 ==="
